name: Check CCTV streams

on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [cctv.m3u, baseline.json, check.py, test_check.py, .github/workflows/check.yml]

permissions:
  contents: read

concurrency:
  group: cctv-stream-check

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate playlist
        run: python3 -m unittest -v
      - name: Prepare FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Measure streams from the hosted runner
        run: python3 check.py --output status.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stream-check
          path: status.json
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref == 'refs/heads/main'
    needs: probe
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: stream-check
          path: report
      - name: Publish audit without changing the playlist
        run: |
          python3 -m json.tool report/status.json >/dev/null
          cp report/status.json status.json
          git add status.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Update CCTV stream audit"
          git push origin HEAD:refs/heads/main
